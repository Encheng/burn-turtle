    if (f) document.querySelectorAll('[data-draw="' + name + '"]').forEach((el) => f(el));
  }
};
</script>
<script>
window.twElev = '2700';
window.twNames = {'2000': '大鹿林道東線（2,000 m）', '2700': '九九山莊（2,700 m）', '3492': '大霸山頂（3,492 m）'};
dash.calc('extremes', {
  inputs: ['hourly'],
  title: '各海拔三天極值',
  description: '每個海拔 72 小時中的最低溫、最低體感與最高溫',
  fn: (hourly) => {
    const g = {};
    hourly.forEach((r) => {
      const k = String(r.elev), t = Number(r.temp), f = Number(r.feels);
      if (!g[k]) g[k] = {elev: k, minT: t, minF: f, maxT: t};
      g[k].minT = Math.min(g[k].minT, t); g[k].minF = Math.min(g[k].minF, f); g[k].maxT = Math.max(g[k].maxT, t);
    });
    return Object.values(g);
  }
});
const twBtns = document.querySelectorAll('.tw-btn');
for (const b of twBtns) {
  b.addEventListener('click', () => {
    window.twElev = b.dataset.elev;
    for (const o of twBtns) o.setAttribute('aria-pressed', o === b ? 'true' : 'false');
    ['chart', 'elevname', 'minT', 'minF', 'maxT'].forEach((n) => dash.draw(n));
  });
}
for (const k of document.querySelectorAll('.tw-km')) k.style.background = dash.colors[Number(k.dataset.m)];
dash.draw('elevname', (el) => { el.textContent = window.twNames[window.twElev]; });
['minT', 'minF', 'maxT'].forEach((k) => {
  dash.draw(k, (el) => {
    const c = dash.data('extremes');
    if (c.status !== 'ok' || !c.data) { el.textContent = '—'; return; }
    const r = c.data.find((x) => String(x.elev) === window.twElev);
    el.setAttribute('data-where', 'elev=' + window.twElev);
    el.textContent = r ? (Math.round(r[k] * 10) / 10).toFixed(1) : '—';
  });
});
</script>
<script>
function twIcon(kind, cx, cy) {
  const cloud = (fill) => `<path d="M${cx-11},${cy+5} a6,6 0 0 1 2,-11 a8,8 0 0 1 15,-2 a6,6 0 0 1 5,13 z" style="fill:${fill}"/>`;
  if (kind === 'sun') {
    let s = `<circle cx="${cx}" cy="${cy}" r="6" style="fill:#EF9F27"/>`;
    for (let a = 0; a < 8; a++) { const r = a * Math.PI / 4; s += `<line x1="${cx+Math.cos(r)*9}" y1="${cy+Math.sin(r)*9}" x2="${cx+Math.cos(r)*12}" y2="${cy+Math.sin(r)*12}" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round"/>`; }
    return s;
  }
  if (kind === 'moon') return `<path d="M${cx+3},${cy-9} a9,9 0 1 0 7,13 a7,7 0 0 1 -7,-13 z" style="fill:#EF9F27"/>`;
  if (kind === 'overcast') return cloud('#888780');
  if (kind === 'cloud') return cloud('#B4B2A9');
  if (kind === 'rain') { let s = cloud('#888780'); for (let i = -1; i <= 1; i++) s += `<line x1="${cx+i*6}" y1="${cy+9}" x2="${cx+i*6-2}" y2="${cy+14}" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round"/>`; return s; }
  if (kind === 'snow') { let s = cloud('#888780'); s += `<line x1="${cx-6}" y1="${cy+9}" x2="${cx-8}" y2="${cy+14}" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round"/>`; for (let i = 0; i <= 1; i++) s += `<circle cx="${cx+i*7}" cy="${cy+12}" r="1.8" style="fill:#85B7EB"/>`; return s; }
  return '';
}
function twKind(w, h, t) {
  const night = h >= 18 || h < 6;
  if (w === '短暫雨') return 'rain';
  if (w === '短暫雨或雪') return t > 1 ? 'rain' : 'snow';
  if (w === '陰') return 'overcast';
  if (w === '多雲') return 'cloud';
  return night ? 'moon' : 'sun';
}
dash.draw('chart', (el) => {
  const h = dash.data('hourly'), wx = dash.data('wx'), md = dash.data('models');
  if (h.status !== 'ok') { el.textContent = h.status === 'error' ? 'Failed to load' : '—'; return; }
  const rows = h.data.filter((r) => String(r.elev) === window.twElev).map((r) => ({time: String(r.time), t: Number(r.temp), f: Number(r.feels)}));
  const wmap = {};
  if (wx.status === 'ok') wx.data.forEach((r) => { wmap[String(r.time)] = {wx: String(r.wx), pop: r.pop === null || r.pop === '' ? null : Number(r.pop), wind: r.wind === null || r.wind === '' ? null : Number(r.wind)}; });
  const MN = ['ECMWF', 'GFS', 'ICON'], mm = {};
  MN.forEach((m) => { mm[m] = {}; });
  if (md.status === 'ok') md.data.forEach((r) => { const m = String(r.model); if (mm[m]) mm[m][String(r.time)] = {p: Number(r.precip), q: r.pop === null || r.pop === '' ? null : Number(r.pop), g: Number(r.gust)}; });
  const C = dash.colors;
  const n = rows.length, W = 40, top = 64, bot = 252, H = 830;
  const all = rows.flatMap((r) => [r.t, r.f]);
  const lo = Math.floor(Math.min(...all)) - 1, hi = Math.ceil(Math.max(...all)) + 1;
  const y = (v) => top + (hi - v) / (hi - lo) * (bot - top), x = (i) => W / 2 + i * W, Wd = n * W;
  const P1 = {t: 360, b: 470}, P2 = {t: 530, b: 640}, P3 = {t: 700, b: 800};
  const slot = (time) => time.slice(0, 11) + String(Math.floor(Number(time.slice(11, 13)) / 3) * 3).padStart(2, '0') + ':00';
  let pmax = 1, gmax = 5;
  rows.forEach((r) => MN.forEach((m) => { const v = mm[m][r.time]; if (v) { pmax = Math.max(pmax, v.p); gmax = Math.max(gmax, v.g); } }));
  Object.values(wmap).forEach((v) => { if (v.wind !== null) gmax = Math.max(gmax, v.wind); });
  pmax = Math.ceil(pmax); gmax = Math.ceil(gmax / 5) * 5;
  const yP = (v) => P1.b - v / pmax * (P1.b - P1.t), yQ = (v) => P2.b - v / 100 * (P2.b - P2.t), yG = (v) => P3.b - v / gmax * (P3.b - P3.t);
  let s = `<svg width="${Wd}" height="${H}" role="img" aria-label="${window.twNames[window.twElev]} 11/20 至 11/22 每小時溫度、降雨量、降雨機率與陣風" style="display:block;font-family:var(--font-anthropic-sans)">`;
  rows.forEach((r, i) => { const hr = Number(r.time.slice(11, 13)); if (hr >= 17 || hr < 6) s += `<rect x="${x(i)-W/2}" y="0" width="${W}" height="${H}" style="fill:var(--color-panel)"/>`; });
  const grid = (yy) => `<line x1="0" x2="${Wd}" y1="${yy}" y2="${yy}" style="stroke:var(--cds-chart-grid)" stroke-width="1"/>`;
  const step = (hi - lo) > 12 ? 5 : 2;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) s += grid(y(v));
  [P1, P2, P3].forEach((p) => { s += grid(p.t) + grid((p.t + p.b) / 2) + `<line x1="0" x2="${Wd}" y1="${p.b}" y2="${p.b}" style="stroke:var(--cds-chart-axis)" stroke-width="1"/>`; });
  if (lo < 0 && hi > 0) s += `<line x1="0" x2="${Wd}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--cds-chart-reference)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  rows.forEach((r, i) => { if (i > 0 && r.time.slice(11, 13) === '00') s += `<line x1="${x(i)-W/2}" x2="${x(i)-W/2}" y1="0" y2="${H}" style="stroke:var(--cds-chart-axis)" stroke-width="1"/>`; });
  const ttl = (yy, txt) => { let o = ''; rows.forEach((r, i) => { if (r.time.slice(11, 13) === '00') o += `<text x="${x(i)-W/2+4}" y="${yy}" style="font-size:12px;font-weight:500;fill:var(--color-fg)">${txt}</text>`; }); return o; };
  s += ttl(P1.t - 14, `降雨量（mm／小時，最大刻度 ${pmax}）`) + ttl(P2.t - 14, '降雨機率（%）') + ttl(P3.t - 14, `陣風（m/s，最大刻度 ${gmax}）`);
  rows.forEach((r, i) => {
    const hr = Number(r.time.slice(11, 13));
    if (hr % 3 === 0 && wmap[r.time]) {
      const c = wmap[r.time];
      if (c.pop !== null) { s += `<rect x="${x(i)-W/2+1}" y="${yQ(c.pop)}" width="${3*W-2}" height="${P2.b-yQ(c.pop)}" style="fill:var(--color-fg-muted);opacity:.25"/>`; s += `<text x="${x(i)+W}" y="${Math.min(yQ(c.pop), P2.b - 2) - 4}" text-anchor="middle" style="font-size:11px;fill:var(--cds-text-secondary)">${Math.round(c.pop)}%</text>`; }
      if (c.wind !== null) { s += `<rect x="${x(i)-W/2+1}" y="${yG(c.wind)}" width="${3*W-2}" height="${P3.b-yG(c.wind)}" style="fill:var(--color-fg-muted);opacity:.25"/>`; s += `<text x="${x(i)+W}" y="${yG(c.wind) - 4}" text-anchor="middle" style="font-size:11px;fill:var(--cds-text-secondary)">${Math.round(c.wind)}</text>`; }
    }
    MN.forEach((m, k) => { const v = mm[m][r.time]; if (v && v.p > 0) s += `<rect x="${x(i)-15+k*10}" y="${yP(v.p)}" width="9" height="${P1.b-yP(v.p)}" rx="1.5" style="fill:${C[k]}"/>`; });
  });
  MN.forEach((m, k) => {
    const pq = rows.filter((r) => mm[m][r.time] && mm[m][r.time].q !== null).map((r) => `${x(rows.indexOf(r))},${yQ(mm[m][r.time].q)}`).join(' ');
    if (pq) s += `<polyline points="${pq}" fill="none" style="stroke:${C[k]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const pg = rows.filter((r) => mm[m][r.time]).map((r) => `${x(rows.indexOf(r))},${yG(mm[m][r.time].g)}`).join(' ');
    if (pg) s += `<polyline points="${pg}" fill="none" style="stroke:${C[k]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  const pl = (k) => rows.map((r, i) => `${x(i)},${y(r[k])}`).join(' ');
  s += `<polyline points="${pl('t')}" fill="none" style="stroke:var(--color-fg-muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<polyline points="${pl('f')}" fill="none" style="stroke:var(--cds-chart-status-critical)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  rows.forEach((r, i) => {
    const ty = y(r.t), fy = y(r.f), hr = Number(r.time.slice(11, 13));
    s += `<circle cx="${x(i)}" cy="${ty}" r="3.5" style="fill:var(--color-fg-muted)"/>`;
    s += `<rect x="${x(i)-3}" y="${fy-3}" width="6" height="6" transform="rotate(45 ${x(i)} ${fy})" style="fill:var(--cds-chart-status-critical)"/>`;
    s += `<text x="${x(i)}" y="${ty-9}" text-anchor="middle" style="font-size:12px;font-weight:500;fill:var(--color-fg);font-variant-numeric:tabular-nums">${Math.round(r.t)}</text>`;
    s += `<text x="${x(i)}" y="${fy+18}" text-anchor="middle" style="font-size:11px;fill:var(--cds-text-secondary);font-variant-numeric:tabular-nums">${Math.round(r.f)}</text>`;
    const hl = `${String(hr).padStart(2, '0')}`, hc = hr >= 6 && hr < 17 ? 'var(--cds-text-secondary)' : 'var(--cds-chart-status-critical)';
    s += `<text x="${x(i)}" y="${bot+32}" text-anchor="middle" style="font-size:11px;fill:${hc}">${hl}</text>`;
    s += `<text x="${x(i)}" y="${P3.b+18}" text-anchor="middle" style="font-size:11px;fill:${hc}">${hl}</text>`;
    if (hr === 0) s += `<text x="${x(i)-W/2+4}" y="${bot+54}" text-anchor="start" style="font-size:12px;font-weight:500;fill:var(--color-fg)">${['11/20（五）', '11/21（六）', '11/22（日）'][Math.floor(i / 24)] || ''}</text>`;
    if (hr % 3 === 0 && wmap[r.time]) s += twIcon(twKind(wmap[r.time].wx, hr, r.t), x(i), 30);
  });
  s += `<line class="tw-cursor" x1="0" x2="0" y1="0" y2="${H}" style="stroke:var(--color-fg-muted);visibility:hidden" stroke-width="1"/>`;
  s += `<rect class="tw-hit" x="0" y="0" width="${Wd}" height="${H}" style="fill:transparent"/></svg>`;
  el.replaceChildren();
  const scroll = document.createElement('div'); scroll.className = 'tw-scroll';
  const inner = document.createElement('div'); inner.className = 'tw-inner'; inner.style.width = Wd + 'px';
  inner.innerHTML = s;
  const tip = document.createElement('div'); tip.className = 'tw-tip'; tip.hidden = true;
  inner.appendChild(tip); scroll.appendChild(inner); el.appendChild(scroll);
  const hit = inner.querySelector('.tw-hit'), cur = inner.querySelector('.tw-cursor');
  const show = (ev) => {
    const b = inner.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.floor((ev.clientX - b.left) / W)));
    const r = rows[i], c = wmap[slot(r.time)];
    tip.replaceChildren();
    const line = (txt, strong) => { const d = document.createElement(strong ? 'strong' : 'div'); d.textContent = txt; tip.append(d); };
    line(r.time.slice(5, 10).replace('-', '/') + ' ' + r.time.slice(11, 16), true);
    line('溫度 ' + r.t.toFixed(1) + '°C　體感 ' + r.f.toFixed(1) + '°C');
    MN.forEach((m) => { const v = mm[m][r.time]; if (v) line(m + '：雨 ' + v.p.toFixed(1) + ' mm　機率 ' + (v.q === null ? '—' : Math.round(v.q) + '%') + '　陣風 ' + v.g.toFixed(1) + ' m/s'); });
    if (c) line('氣象署：' + c.wx + (c.pop === null ? '' : '　機率 ' + Math.round(c.pop) + '%') + (c.wind === null ? '' : '　風速 ' + Math.round(c.wind) + ' m/s'));
    tip.hidden = false;
    tip.style.top = Math.max(8, Math.min(H - 150, ev.clientY - b.top - 60)) + 'px';
    tip.style.left = (x(i) + 330 > Wd ? x(i) - 330 : x(i) + 12) + 'px';
    cur.setAttribute('x1', x(i)); cur.setAttribute('x2', x(i)); cur.style.visibility = 'visible';
  };
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => { tip.hidden = true; cur.style.visibility = 'hidden'; });
});
</script>
